<div class="page">
  <div class="page__header">
    <div>
      <h1>Energy overview</h1>
      <p class="page__subtitle">
        {{ today | date: 'EEEE d MMMM y' }}
        @if (systemStatus.latestRecords().solarman; as solarman) {
          · solar data up to {{ solarman | date: 'd MMM, HH:mm' }}
        }
      </p>
    </div>
    <a routerLink="/upload" class="sm-btn sm-btn--primary">
      <svg class="sm-icon" width="18" height="18" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 16V4M7 9l5-5 5 5M4 20h16"></path></svg>
      Import data
    </a>
  </div>

  <app-energy-summary></app-energy-summary>

  <div class="charts">
    <app-production-chart></app-production-chart>
    <app-tshwane-chart></app-tshwane-chart>
  </div>

  <app-status-panel></app-status-panel>
</div>
