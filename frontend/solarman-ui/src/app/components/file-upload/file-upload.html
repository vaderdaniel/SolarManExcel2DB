<section class="sm-card upload">
  <fieldset class="sources">
    <legend>What are you importing?</legend>
    <div class="sources__grid">
      @for (source of sources; track source.id) {
        <label class="source" [class.is-selected]="fileType() === source.id">
          <input
            type="radio"
            name="file-type"
            [value]="source.id"
            [checked]="fileType() === source.id"
            (change)="selectFileType(source.id)"
          >
          <span class="source__text">
            <span class="source__title">{{ source.title }}</span>
            <span class="source__desc">{{ source.description }}</span>
          </span>
        </label>
      }
    </div>
  </fieldset>

  <label
    class="dropzone"
    [class.is-dragging]="isDragging()"
    for="file-input"
    (dragover)="onDragOver($event)"
    (dragleave)="onDragLeave()"
    (drop)="onDrop($event)"
  >
    <input
      #fileInput
      id="file-input"
      type="file"
      accept=".xlsx,.xls"
      class="sm-visually-hidden"
      (change)="onFileSelected($event)"
    >
    <svg class="sm-icon dropzone__icon" width="32" height="32" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 16V4M7 9l5-5 5 5M4 20h16"></path></svg>
    <span class="dropzone__title">Choose an Excel file or drop it here</span>
    <span class="dropzone__hint">.xlsx or .xls · up to 10 MB · {{ sourceHint() }}</span>
  </label>

  @if (errorMessage(); as error) {
    <p class="upload__error" role="alert">{{ error }}</p>
  }

  @if (selectedFile(); as file) {
    <div class="selected-file">
      <svg class="sm-icon selected-file__icon" width="22" height="22" viewBox="0 0 24 24" aria-hidden="true"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"></path><path d="M14 3v5h5"></path></svg>
      <div class="selected-file__info">
        <div class="selected-file__name">{{ file.name }}</div>
        <div class="selected-file__meta">{{ fileSize() }}</div>
      </div>
      <button
        type="button"
        class="icon-btn"
        aria-label="Remove file"
        (click)="clearFileSelection()"
        [disabled]="isUploading()"
      >
        <svg class="sm-icon" width="18" height="18" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg>
      </button>
    </div>
  }

  <div class="upload__actions">
    <button
      type="button"
      class="sm-btn sm-btn--primary"
      (click)="uploadFile()"
      [disabled]="!selectedFile() || isUploading()"
    >
      {{ isUploading() ? 'Reading file…' : 'Upload & preview' }}
    </button>
  </div>
</section>
